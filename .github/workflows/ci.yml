name: CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'renovate.json'
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'renovate.json'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
