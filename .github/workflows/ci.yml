name: CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'renovate.json'
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'renovate.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
